services:
  db:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: tea_culture
      MYSQL_USER: tea
      MYSQL_PASSWORD: tea_secret
      MYSQL_ROOT_PASSWORD: root_secret
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot_secret"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: tea_culture
      DB_USERNAME: tea
      DB_PASSWORD: tea_secret
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/var/www/html
    entrypoint: ["/bin/sh", "/var/www/html/docker-entrypoint.sh"]

  frontend:
    image: node:20-alpine
    platform: linux/amd64
    working_dir: /app
    environment:
      VITE_API_TARGET: "http://backend:8000"
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      - backend
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 3000"

volumes:
  mysql_data:
  frontend_node_modules:
